name: Deploy Docker to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: false
        default: stockprob-r
      region:
        description: Google Cloud region
        required: false
        default: us-central1
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - js/**
      - .github/workflows/gcp-cloud-run.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_ARTIFACT_REGION || 'us-central1' }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'stockprob-r' }}
  SERVICE: ${{ github.event.inputs.service || vars.CLOUD_RUN_SERVICE || 'stockprob-r' }}
  REGION: ${{ github.event.inputs.region || vars.CLOUD_RUN_REGION || 'us-central1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --location="$GAR_LOCATION" \
          || gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker \
            --location="$GAR_LOCATION" \
            --description="StockProb-R Docker images"

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/stockprob-r:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${{ steps.image.outputs.image }}" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars=NODE_ENV=production,USE_YFINANCE=true,ENABLE_DEMO_FALLBACK=true

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)'
